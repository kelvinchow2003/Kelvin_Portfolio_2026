<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153f30" />
      <stop offset="50%" stop-color="#0a2119" />
      <stop offset="100%" stop-color="#04100a" />
    </linearGradient>

    <radialGradient id="spot" cx="70%" cy="4%" r="70%">
      <stop offset="0%" stop-color="#c8ffdd" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#4f9d69" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#4f9d69" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4234" />
      <stop offset="100%" stop-color="#07160f" />
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2fbf5" />
      <stop offset="42%" stop-color="#a9c4b6" />
      <stop offset="100%" stop-color="#2c4238" />
    </linearGradient>

    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93ab9d" />
      <stop offset="100%" stop-color="#182720" />
    </linearGradient>

    <radialGradient id="lens" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#f2fff6" />
      <stop offset="35%" stop-color="#7cfc9a" />
      <stop offset="100%" stop-color="#155c34" />
    </radialGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cfc9a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7cfc9a" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7cfc9a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7cfc9a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03100a" stop-opacity="0" />
      <stop offset="60%" stop-color="#03100a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#010806" stop-opacity="0.94" />
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="soft-sm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)" />
  <rect width="400" height="300" fill="url(#spot)" />

  <!-- distant factory structure -->
  <g opacity="0.55" stroke="#3a5c4c" stroke-width="1.5" fill="none">
    <path d="M0 46 L34 18 L68 46" />
    <path d="M68 46 L102 18 L136 46" />
    <path d="M136 46 L170 18 L204 46" />
    <line x1="0" y1="46" x2="400" y2="46" />
    <line x1="34" y1="46" x2="34" y2="18" />
    <line x1="102" y1="46" x2="102" y2="18" />
    <line x1="170" y1="46" x2="170" y2="18" />
  </g>
  <g opacity="0.4">
    <rect x="20" y="52" width="10" height="34" fill="#0d241b" />
    <rect x="330" y="40" width="12" height="46" fill="#0d241b" />
    <rect x="352" y="52" width="10" height="34" fill="#0d241b" />
  </g>
  <g opacity="0.5" fill="#7cfc9a">
    <rect x="22" y="60" width="3.5" height="5" />
    <rect x="22" y="70" width="3.5" height="5" />
    <rect x="333" y="48" width="3.5" height="5" />
    <rect x="333" y="60" width="3.5" height="5" />
  </g>

  <g opacity="0.45" stroke="#7cfc9a" stroke-opacity="0.14">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="130" y1="0" x2="70" y2="230" />
    <line x1="270" y1="0" x2="345" y2="230" />
  </g>

  <circle cx="325" cy="65" r="66" fill="#7cfc9a" opacity="0.16" filter="url(#soft)" />

  <!-- distant secondary robot for depth -->
  <g opacity="0.4">
    <rect x="288" y="150" width="14" height="46" rx="3" fill="#0d241b" stroke="#2c4a3c" stroke-width="2" />
    <path d="M295 150 C 295 128, 308 118, 322 122" fill="none" stroke="#2c4a3c" stroke-width="7" stroke-linecap="round" />
    <circle cx="322" cy="122" r="5.5" fill="#0d241b" stroke="#2c4a3c" stroke-width="2" />
  </g>

  <rect x="0" y="228" width="400" height="72" fill="url(#floor)" />
  <rect x="0" y="228" width="400" height="4" fill="#7cfc9a" opacity="0.4" />
  <g opacity="0.55" stroke="#07160f" stroke-width="1.5">
    <line x1="0" y1="244" x2="400" y2="244" />
    <line x1="0" y1="260" x2="400" y2="260" />
    <line x1="0" y1="276" x2="400" y2="276" />
  </g>
  <!-- conveyor rollers -->
  <g fill="#0a1f16" stroke="#284839" stroke-width="1.5">
    <circle cx="60" cy="231" r="4" />
    <circle cx="100" cy="231" r="4" />
    <circle cx="300" cy="231" r="4" />
    <circle cx="340" cy="231" r="4" />
  </g>

  <ellipse cx="205" cy="234" rx="46" ry="9" fill="url(#pool)" filter="url(#soft-sm)" />

  <!-- workpiece under inspection -->
  <g>
    <rect x="182" y="208" width="46" height="26" rx="4" fill="url(#metalDark)" stroke="#07160f" stroke-width="2" />
    <rect x="190" y="200" width="30" height="12" rx="3" fill="url(#metal)" stroke="#07160f" stroke-width="1.5" />
    <rect x="196" y="215" width="18" height="4" rx="1.5" fill="#7cfc9a" opacity="0.75" />
  </g>

  <!-- vision scan cone from camera lens down onto the part -->
  <polygon points="221,150 250,150 226,206 208,206" fill="url(#scan)" opacity="0.8" />
  <line x1="235" y1="150" x2="217" y2="206" stroke="#7cfc9a" stroke-width="1.4" stroke-dasharray="3 6" opacity="0.9" />

  <!-- robot arm -->
  <g>
    <ellipse cx="92" cy="252" rx="38" ry="11" fill="#02100a" opacity="0.65" filter="url(#soft-sm)" />

    <rect x="66" y="212" width="52" height="42" rx="7" fill="url(#metalDark)" stroke="#07160f" stroke-width="2.5" />
    <rect x="60" y="222" width="10" height="16" rx="2" fill="#0a1f16" stroke="#284839" stroke-width="1.5" />
    <rect x="74" y="192" width="36" height="26" rx="7" fill="url(#metal)" stroke="#07160f" stroke-width="2.5" />
    <circle cx="92" cy="205" r="3" fill="#7cfc9a" opacity="0.9" />

    <path
      d="M92 196 C 92 146, 108 112, 148 100"
      fill="none"
      stroke="url(#metal)"
      stroke-width="21"
      stroke-linecap="round"
    />
    <path
      d="M92 196 C 92 146, 108 112, 148 100"
      fill="none"
      stroke="#07160f"
      stroke-width="21"
      stroke-linecap="round"
      opacity="0.16"
    />

    <circle cx="148" cy="100" r="16" fill="url(#metal)" stroke="#07160f" stroke-width="2.5" />
    <circle cx="148" cy="100" r="5.5" fill="#07160f" opacity="0.55" />

    <path
      d="M148 100 C 190 92, 226 104, 224 138"
      fill="none"
      stroke="url(#metal)"
      stroke-width="16"
      stroke-linecap="round"
    />

    <circle cx="224" cy="138" r="12" fill="url(#metal)" stroke="#07160f" stroke-width="2.5" />

    <g transform="translate(220 130) rotate(18)">
      <rect x="0" y="0" width="50" height="36" rx="7" fill="url(#metalDark)" stroke="#07160f" stroke-width="2.5" />
      <rect x="7" y="7" width="16" height="6" rx="2" fill="#7cfc9a" opacity="0.9" />
      <rect x="7" y="16" width="10" height="4" rx="1.5" fill="#2c4a3c" />
      <circle cx="37" cy="18" r="13" fill="#07160f" />
      <circle cx="37" cy="18" r="10.3" fill="url(#lens)" />
      <circle cx="37" cy="18" r="10.3" fill="none" stroke="#07160f" stroke-width="1.5" />
      <circle cx="32.5" cy="13.5" r="2.6" fill="#f2fff6" opacity="0.95" />
    </g>
  </g>

  <circle cx="55" cy="85" r="2.4" fill="#7cfc9a" opacity="0.7" />
  <circle cx="360" cy="200" r="2" fill="#7cfc9a" opacity="0.5" />
  <circle cx="380" cy="230" r="1.8" fill="#7cfc9a" opacity="0.6" />
  <circle cx="20" cy="150" r="1.6" fill="#7cfc9a" opacity="0.5" />
  <circle cx="140" cy="60" r="1.5" fill="#7cfc9a" opacity="0.45" />

  <rect width="400" height="300" fill="url(#vignette)" />
  <rect width="400" height="300" fill="url(#scrim)" />

  <text x="24" y="246" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#7cfc9a">
    APPLICATIONS SPECIALIST
  </text>
  <text x="24" y="273" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" letter-spacing="0.3" fill="#f4fbf6">
    SHELLEY AUTOMATION
  </text>
  <text x="24" y="291" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="500" fill="#c9ddce">
    Machine Vision · Industrial Robotics
  </text>
</svg>
